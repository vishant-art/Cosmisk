[project]
name = "cosmisk-connectors"
version = "0.1.0"
description = "Cosmisk data connectors: Meta Ads + Shopify + Google Ads → one abstract, fault-isolated UnifiedSnapshot for the AI layer."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# google-ads (gRPC) is heavy and only needed when a Google token is configured.
# Without it the Google connector stays `skipped` — Meta+Shopify deploys stay lean.
google = ["google-ads>=25.0"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["connectors*"]
