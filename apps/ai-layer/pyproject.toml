[project]
name = "cosmisk-ai-layer"
version = "0.1.0"
description = "Cosmisk AI layer: Meta Ads L1 transform, deterministic brain, and RAG chat (Phase 1 packaging of rnd/)."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ai_layer"]
