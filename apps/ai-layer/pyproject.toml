[project]
name = "cosmisk-ai-layer"
version = "0.1.0"
description = "Cosmisk AI layer: Meta Ads L1 transform, deterministic brain, and RAG chat (Phase 1 packaging of rnd/)."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    # Creative Studio generation pipeline (lazy-imported; needed for live runs):
    "pillow>=10.1",          # deterministic compositor (copy/logo/scrim)
    "fal-client>=0.5",       # the only generation provider (FLUX.2 + Bria + Seedance)
    "imageio-ffmpeg>=0.5",   # bundled static ffmpeg for the video copy overlay
    # Neon Postgres data layer (facts store + cost ledger + creative jobs; see #29):
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ai_layer", "ai_layer.creative", "ai_layer.db"]
