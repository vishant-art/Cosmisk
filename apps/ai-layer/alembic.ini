[alembic]
# Dev-only: for `alembic revision --autogenerate` run from apps/ai-layer.
# Runtime migrations use ai_layer.db.migrate (which locates this dir inside the
# installed package) and do NOT read this file.
script_location = ai_layer/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
