services:
  cosmisk-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cosmisk-dev
    hostname: cosmisk-dev
    working_dir: /workspace
    command: ["sleep", "infinity"]
    init: true
    ports:
      - "3000:3000"
    environment:
      # development: skips the prod boot guard that requires real Anthropic/Meta keys.
      # The "lean" memory profile comes from skipping tsx watch / ng serve, not from NODE_ENV.
      NODE_ENV: development
      PORT: "3000"
      DATABASE_PATH: /workspace/server/data/cosmisk.db
      APP_URL: http://localhost:3000
      PUPPETEER_SKIP_DOWNLOAD: "true"
    env_file:
      - ../server/.env
    volumes:
      # Source: bind-mounted so host edits are visible inside the container
      - ../:/workspace:cached
      # node_modules: named volumes (avoid host FS perf hit, keep host clean)
      - root_node_modules:/workspace/node_modules
      - server_node_modules:/workspace/server/node_modules
      # SQLite data: bind-mounted so DB survives container removal and is host-inspectable
      - ../server/data:/workspace/server/data
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
    restart: unless-stopped

volumes:
  root_node_modules:
  server_node_modules:
