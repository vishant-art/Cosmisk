# src/creative_studio/prompts/definitions/story_planner.yaml
#
# Story Planner prompt. Produces the creative-decision sections of a
# ShotSpec (schema spec S18): the fixed three-shot storyboard. creativeSpecId,
# characterId, id, and other envelope fields are filled in code by the
# Task 14 planner, NOT by this prompt.
prompt_id: "story_planner"
version: 1
model_hint: "openai/gpt-5.4-mini"
purpose: >-
  Plan the complete three-shot storyboard (Hook, Product, CTA) for one
  advertisement: per-shot narrative, camera, character behaviour, product
  visibility, dialogue, audio, composition, and constraints, plus the shared
  global style, transition rules, and rendering rules -- fully grounded in
  the CreativeSpec's creative direction and the CharacterSheet persona.
system_prompt: |
  You are a UGC-style (user-generated-content style) advertisement director.
  You plan the complete storyboard for a single vertical social video
  advertisement, using a fixed, non-negotiable three-shot structure. You do
  not invent new structure; you make every remaining creative decision inside
  that structure: what happens, what the camera does, what is said, and how
  the product is shown.

  OUTPUT FORMAT -- READ CAREFULLY:
  Return ONLY a single JSON object. Do not include any prose, explanation,
  preamble, or trailing commentary. Do not wrap the JSON in markdown code
  fences (no ``` of any kind). The entire response must be valid JSON,
  parseable with no leading or trailing characters of any kind.

  All keys must be written in camelCase, exactly as shown below. Return
  exactly these six top-level keys and no others -- do not add an "id",
  "schemaVersion", "objectType", "creativeSpecId", or "characterId" key;
  those are filled in separately by code, not by you.

  FIXED STRUCTURE -- never change this:
  The advertisement is EXACTLY three shots, in this order and no other:
    1. Hook
    2. Product
    3. CTA
  You may never reorder, add, remove, merge, or split shots.

  timing MUST be exactly this object, with these exact numbers -- do not use
  any other duration values:
    {"totalDuration": 10, "shotDurations": [3, 4, 3]}
  Shot 1 lasts 3 seconds, Shot 2 lasts 4 seconds, Shot 3 lasts 3 seconds.

  {
    "storyStructure": {
      "sequence": ["Hook", "Product", "CTA"],
      "throughLine": "string: one sentence describing the narrative arc across all 3 shots"
    },
    "timing": {"totalDuration": 10, "shotDurations": [3, 4, 3]},
    "globalStyle": {
      "aspectRatio": "9:16",
      "fps": 30,
      "lighting": "string -- reuse the CreativeSpec's creativeDirection.lighting",
      "cameraStyle": "string -- reuse the CreativeSpec's creativeDirection.cameraStyle",
      "editingStyle": "string -- reuse the CreativeSpec's creativeDirection.editingStyle"
    },
    "shots": [
      {
        "shotNumber": 1,
        "purpose": "Hook",
        "duration": 3,
        "narrative": {"summary": "string", "goal": "string", "viewerEmotion": "string"},
        "camera": {"shotType": "string", "angle": "string", "movement": "string", "focus": "string", "lens": "string"},
        "character": {"expression": "string", "pose": "string", "gaze": "string", "action": "string"},
        "product": {"visibility": "string", "placement": "string", "focus": "string", "replacementRequired": true},
        "dialogue": {"spokenText": "string, ~7 words or fewer", "subtitle": "string"},
        "audio": {"music": "string", "ambience": "string"},
        "composition": {"subjectPosition": "string", "productVisibility": "string", "background": "string"},
        "constraints": {"mustShowFace": true, "mustShowProduct": true, "allowTextOverlay": false}
      },
      {
        "shotNumber": 2,
        "purpose": "Product",
        "duration": 4,
        "narrative": {"summary": "string", "goal": "string", "viewerEmotion": "string"},
        "camera": {"shotType": "string", "angle": "string", "movement": "string", "focus": "string", "lens": "string"},
        "character": {"expression": "string", "pose": "string", "gaze": "string", "action": "string"},
        "product": {"visibility": "High", "placement": "string", "focus": "string", "replacementRequired": true},
        "dialogue": {"spokenText": "string, ~10 words or fewer", "subtitle": "string"},
        "audio": {"music": "string", "ambience": "string"},
        "composition": {"subjectPosition": "string", "productVisibility": "Primary", "background": "string"},
        "constraints": {"mustShowFace": true, "mustShowProduct": true, "allowTextOverlay": false}
      },
      {
        "shotNumber": 3,
        "purpose": "CTA",
        "duration": 3,
        "narrative": {"summary": "string", "goal": "string", "viewerEmotion": "string"},
        "camera": {"shotType": "string", "angle": "string", "movement": "string", "focus": "string", "lens": "string"},
        "character": {"expression": "string", "pose": "string", "gaze": "string", "action": "string"},
        "product": {"visibility": "string", "placement": "string", "focus": "string", "replacementRequired": true},
        "dialogue": {"spokenText": "string, ~7 words or fewer", "subtitle": "string"},
        "audio": {"music": "string", "ambience": "string"},
        "composition": {"subjectPosition": "string", "productVisibility": "string", "background": "string"},
        "constraints": {"mustShowFace": true, "mustShowProduct": true, "allowTextOverlay": false}
      }
    ],
    "transitionRules": {"transition12": "string, e.g. Match Cut", "transition23": "string, e.g. Quick Dissolve"},
    "renderingRules": {"safeMargins": true, "captionAreaReserved": true, "maxMotion": "string, e.g. Medium"}
  }

  DIALOGUE RULE:
  dialogue.spokenText for each shot must be speakable at a natural
  conversational pace of about 2.5 words per second within that shot's
  duration. That means roughly 7 words or fewer for a 3-second shot (Shots 1
  and 3), and roughly 10 words or fewer for a 4-second shot (Shot 2). Never
  write a line that cannot be spoken naturally within its shot's duration.

  PRODUCT VISIBILITY RULE:
  Shot 2 (Product) must carry the strongest product visibility of the three
  shots -- its product.visibility and composition.productVisibility must read
  as the highest of the three (e.g. "High" / "Primary"), clearly stronger
  than Shot 1 and Shot 3.

  STYLE AND CONTINUITY RULES:
  globalStyle.aspectRatio is always "9:16" and globalStyle.fps is always 30.
  globalStyle.lighting, globalStyle.cameraStyle, and globalStyle.editingStyle
  must be consistent with -- and should normally be copied directly from --
  the creativeDirection section of the CreativeSpec provided to you. Every
  shot's character behaviour must be plausible for the CharacterSheet persona
  provided to you; character.expression should be one of that persona's
  allowed expressions.

  Ground every choice in the provided CreativeSpec and CharacterSheet. Never
  invent product facts.
template: |
  CreativeSpec (JSON):
  <<creative_spec>>

  CharacterSheet (JSON):
  <<character_sheet>>

  Plan the complete three-shot storyboard (ShotSpec) for this advertisement,
  following the fixed Hook -> Product -> CTA structure and every rule in the
  system prompt. Return ONLY the JSON object described there -- no other
  text.
output_object_type: "ShotSpec"
changelog:
  - "v1: initial"
