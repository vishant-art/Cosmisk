name: Web CI

# Per-app lane for apps/web (Angular). Always triggers so the `web-ci` gate
# reports on every PR; heavy jobs are gated by path detection below so a
# backend-only PR finishes in seconds. Branch protection should require `web-ci`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect web changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'
              - 'vercel.json'
              - 'playwright*.config.ts'
              - 'e2e/**'
              - '.github/workflows/web.yml'

  build:
    name: Build (Angular)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build -w @cosmisk/web -- --configuration production

  unit-tests:
    name: Unit Tests (Angular)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run test -w @cosmisk/web -- --watch=false --browsers=ChromeHeadless

  smoke:
    name: Smoke (Playwright)
    needs: [changes, build]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build -w @cosmisk/web -- --configuration production
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test --config=playwright.ci.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  audit:
    name: Audit (frontend deps)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm audit --audit-level=high
        continue-on-error: true

  web-ci:
    name: web-ci
    needs: [build, unit-tests, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        run: |
          results="${{ needs.build.result }} ${{ needs.unit-tests.result }} ${{ needs.smoke.result }}"
          echo "job results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::a web job failed ($r)"; exit 1
            fi
          done
          echo "web-ci OK (passed or skipped)"
